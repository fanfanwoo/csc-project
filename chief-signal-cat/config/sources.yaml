sources:
  # Google News search RSS is relevance-ranked, not date-ranked: without `when:`
  # the top 50 were all >14 days old and dropped as stale (Sep 2026).
  # when:14d matches filter.max_age_days.
  # Query: ("car loan" OR "vehicle finance" OR "auto lending" OR "buy now pay later"
  #   OR "novated lease") (australia OR ASX) when:14d
  # Phrases are quoted and grouped so the AU condition applies to every one;
  # hl/gl only pick the AU edition, they don't restrict results to AU stories.
  # The old unquoted query returned 4/18 AU-publisher items; this form 17/38
  # (Oct 2026). "OR ASX" catches listed-company stories that never say "Australia".
  - name: "Google News AU"
    type: "news"
    trust_tier: "aggregator"
    connector: "rss"
    url: "https://news.google.com/rss/search?q=%28%22car+loan%22+OR+%22vehicle+finance%22+OR+%22auto+lending%22+OR+%22buy+now+pay+later%22+OR+%22novated+lease%22%29+%28australia+OR+ASX%29+when%3A14d&hl=en-AU&gl=AU&ceid=AU:en"
    region: "AU"
    source_weight: 0.5
    max_items: 50
    # Health threshold: an aggregator sweeping all AU car-finance news should
    # produce something most days; 3 quiet days means the query or feed broke.
    max_staleness_days: 3

  # ASIC publishes across its full remit (not only consumer finance).
  # Official items are keyword-exempt (filter.keyword_match_exempt_tiers) but still
  # pass the region and recency checks, so only releases within max_age_days reach
  # the classifier (~20 newest; fewer in quiet weeks).
  # Endpoint: newsroom-mr-latest.json (20 newest media releases, newest-first) is
  # what asic.gov.au/newsroom itself loads. The old /scripts/newsroom/newsroom-all.json
  # is a frozen copy ending Dec 2024 — every item was dropped as stale (Sep 2026).
  # Day 1 decision: rely on classifier relevance_score + scorer + top_n:5 to
  # filter off-domain items. Tighten with a relevance gate if off-topic items
  # surface in the brief after the first few runs.
  - name: "ASIC Media"
    type: "regulator"
    trust_tier: "official"
    connector: "official_page"
    url: "https://download.asic.gov.au/asic-nga/data/newsroom/newsroom-mr-latest.json"
    region: "AU"
    source_weight: 1.0
    max_items: 20
    # Health threshold: ASIC publishes in bursts and goes quiet over weekends,
    # so 4 days spans a normal lull without hiding a frozen endpoint.
    max_staleness_days: 4

  # Body-bearing publisher (v1b). The Atom feed <summary> is only a headline +
  # standfirst (~180–215 chars) — NOT evidence. But each entry's alternate <link>
  # is a real, direct article URL (…-NNNNNN.aspx), server-rendered static HTML with
  # the full body present. enrich_fetch fetches that URL and extracts the body from
  # body_selector. Mirrors the ASIC two-stage pattern. /premium/ paths are paywalled.
  # source_weight 0.6 = Day 1 trust-tier reference for trade_press (not ad-hoc).
  # Mortgage/property-heavy; lighter on car finance — do not raise weight speculatively.
  - name: "Australian Broker"
    type: "news"
    trust_tier: "trade_press"
    connector: "rss"
    url: "https://www.brokernews.com.au/rss"
    region: "AU"
    source_weight: 0.6
    max_items: 30
    # Health threshold: weekday trade press — 4 days covers a long weekend.
    max_staleness_days: 4
    body_selector: "div.article-detail"
    # AB-only vocabulary, added to the global filter.keyword_allowlist for this source
    # only (rates / lending language the car-finance global list misses). Whole-word,
    # case-insensitive; plurals listed explicitly. Measured 13/30 kept on 2026-09-27.
    keyword_allowlist:
      - "RBA"
      - "cash rate"
      - "cash rates"
      - "rate hike"
      - "rate hikes"
      - "rate cut"
      - "rate cuts"
      - "fixed rate"
      - "fixed rates"
      - "lender"
      - "lenders"
      - "reprice"
      - "reprices"
      - "household credit"
      - "credit demand"
      - "business loan"
      - "business loans"
      - "borrower"
      - "borrowers"
      - "borrowing"
      - "lending"
